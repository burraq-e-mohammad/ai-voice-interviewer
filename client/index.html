<!doctype html>
<!--
  Voice Chatbot: hands-free web client (Gemini-Live style).

  How to run:
    1. Start the API:      uvicorn app.main:app --reload
    2. Serve this folder:  python -m http.server 5500 --directory client
    3. Open:               http://localhost:5500

  Why port 5500 and not double-clicking the file?
    * Browsers only give microphone access to secure pages (https or localhost).
    * The API only accepts browser requests from allowed origins (CORS_ORIGINS),
      and http://localhost:5500 is in that list by default.

  Files:
    index.html  the page structure (this file)
    styles.css  the look: dark theme, blue glow, wave pill, buttons
    app.js      the logic: mic, silence detection, calling POST /chat, playing replies
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voice Chatbot Live</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-state="idle">
  <!-- The blue light that rises from the bottom of the screen. Its height and
       brightness follow the voice level (set from app.js via the --level CSS variable). -->
  <div class="glow" aria-hidden="true"></div>

  <!-- ===== Start screen (shown before the conversation begins) ===== -->
  <main id="startScreen" class="screen start-screen">
    <div class="sparkle" aria-hidden="true">✦</div>
    <h1>Talk to your assistant</h1>
    <p class="subtitle">Just speak naturally. I'll reply when you pause.</p>
    <button id="startBtn" class="start-btn" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>
      Start talking
    </button>
    <p id="startError" class="start-error" role="alert"></p>
  </main>

  <!-- ===== Live screen (shown during the conversation) ===== -->
  <main id="liveScreen" class="screen live-screen" hidden>
    <header class="top-bar">
      <span class="live-badge"><span class="live-dot"></span>Live</span>
    </header>

    <!-- What was said: the user's words (small) and the bot's reply (large). -->
    <section class="captions" aria-live="polite">
      <p id="userCaption" class="caption user-caption"></p>
      <p id="botCaption" class="caption bot-caption"></p>
    </section>

    <footer class="dock">
      <p id="status" class="status">Listening…</p>

      <!-- The animated wave "pill". Click it while the bot speaks to interrupt. -->
      <button id="wavePill" class="wave-pill" type="button" aria-label="Voice activity. Click to interrupt the reply.">
        <canvas id="waveCanvas"></canvas>
      </button>

      <div class="controls">
        <!-- Mute: turns the microphone off so the bot can talk without being interrupted. -->
        <button id="micBtn" class="round-btn mic-btn" type="button" aria-pressed="false" aria-label="Mute microphone" title="Mute microphone">
          <svg class="icon-mic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>
          <svg class="icon-mic-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12h-2c0 .8-.2 1.6-.5 2.3l1.5 1.5c.6-1.1 1-2.4 1-3.8Zm-4 .2V6a3 3 0 0 0-5.9-.8L15 11.1v1.1ZM4.3 3 3 4.3l6 6V12a3 3 0 0 0 4.4 2.6l1.6 1.7A5 5 0 0 1 7 12H5a7 7 0 0 0 6 6.9V21h2v-2.1c1-.1 1.9-.5 2.7-1l4 4 1.3-1.3L4.3 3Z"/></svg>
        </button>
        <!-- End: stops the conversation and releases the microphone. -->
        <button id="endBtn" class="round-btn end-btn" type="button" aria-label="End conversation" title="End conversation">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12Z"/></svg>
        </button>
      </div>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
