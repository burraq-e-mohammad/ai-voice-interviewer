# Central configuration for the project's tools.

[project]
name = "ai-voice-interviewer"
version = "2.0.0"
description = "Hands-free AI voice interviewer: Faster-Whisper STT -> Google Gemini / Groq LLM -> Piper TTS, served by FastAPI"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W: style errors, F: real bugs (unused imports...), I: import order,
# B: common bug patterns, UP: modern Python syntax, N: naming conventions
select = ["E", "W", "F", "I", "B", "UP", "N"]
ignore = ["B008"]  # FastAPI's Depends()/File() in defaults is the intended pattern

[tool.mypy]
python_version = "3.11"
strict = false
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["tests/"]
